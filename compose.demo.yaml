# Use together with compose.yaml; the mock provider has no external dependencies.
services:
  mock-provider:
    build: .
    image: rc-qiming:local
    command: ["uvicorn", "notification_service.mock_provider:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "127.0.0.1:8002:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 2s
      timeout: 5s
      retries: 10
  worker:
    depends_on:
      mock-provider:
        condition: service_healthy
